<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laborheft – Kreuzreaktionen bei Substanztests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfcf7; --desk:#e9eef3; --karo:#cfdcec; --text:#25303f; --muted:#5b6677; --ink:#1c3fa0;
  --red:#cf2f2a; --green:#1d8248; --hl:#fff09a; --focus:#e6eeff;
  --gA:#16877a; --gB:#8352bf; --gC:#c2417e; --rev:#a8791a; --tab:var(--gA);
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --ui:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1c2232; --desk:#121620; --karo:#2e3a55; --text:#e7ebf3; --muted:#a4aec3; --ink:#93b6ff;
    --red:#ff6b64; --green:#55d492; --hl:#5a5120; --focus:#26335a;
    --gA:#2fbfa9; --gB:#ab85e8; --gC:#ff6fb5; --rev:#e0ae45;
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.55;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tab);outline-offset:2px}
.hidden{display:none!important}
main{max-width:860px;margin:0 auto;padding:18px 14px 48px}

/* Kopf */
.cover{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:flex-start;gap:12px}
.label{background:var(--paper);border:2px solid var(--text);border-radius:6px;padding:8px 18px 6px;transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--text)}
.label h1{font-family:var(--hand);font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--ink)}
.label p{margin:0;font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 280px}
.stat{background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;border:1px solid var(--karo)}
.stat b{font-weight:700}
.stat .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:0}
.qrbtn{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--text);border-radius:7px;background:var(--paper);color:var(--text);box-shadow:2px 2px 0 var(--text);padding:0}
.qrbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--text)}

/* Reiter */
.tabs{display:flex;gap:6px;margin:22px 0 0 10px;position:relative;z-index:1;flex-wrap:wrap;align-items:flex-end}
.tab{border:none;border-radius:12px 12px 0 0;padding:10px 13px 12px;font-weight:700;font-size:15px;white-space:nowrap;color:#fff;opacity:.55;transform:translateY(6px);transition:transform .15s,opacity .15s}
.tab[data-g="A"]{background:var(--gA)} .tab[data-g="B"]{background:var(--gB)} .tab[data-g="C"]{background:var(--gC)} .tab[data-g="R"]{background:var(--rev)}
.tab[aria-selected="true"]{opacity:1;transform:none}
.tab .badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:rgba(255,255,255,.3);font-size:13px;text-align:center}
.tab .sm{display:none}
@media (prefers-color-scheme: dark){.tab{color:#121620}}

/* Heftseite */
.sheet{position:relative;background:var(--paper);border-radius:4px 14px 14px 14px;border-top:6px solid var(--tab);padding:18px 16px 22px;box-shadow:0 2px 0 var(--karo),0 10px 30px rgba(20,30,50,.08);
  background-image:linear-gradient(var(--karo) 1px,transparent 1px),linear-gradient(90deg,var(--karo) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:color-mix(in srgb,var(--red) 45%,transparent);pointer-events:none}
.inner{position:relative;padding-left:40px}
.grouphead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.grouphead h2{font-family:var(--hand);font-weight:400;font-size:34px;line-height:1.05;margin:0;color:var(--ink);background:var(--paper);padding:0 8px;border-radius:6px}
.lvl{font-size:12px;font-weight:700;color:#fff;background:var(--tab);border-radius:999px;padding:2px 10px}
.phases{list-style:none;display:flex;gap:6px;padding:0;margin:6px 0 10px;flex-wrap:wrap}
.phases li{background:var(--paper);border:1.5px solid var(--karo);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted)}
.phases li button{all:unset;cursor:pointer}
.phases li.now{border-color:var(--tab);color:var(--text);font-weight:700;box-shadow:inset 0 0 0 1px var(--tab)}
.phases li.done{color:var(--green);border-color:var(--green)}
.phases li.locked{opacity:.55}

.card{background:var(--paper);border-radius:12px;padding:14px 16px;margin:10px 0;border:1.5px solid var(--karo);max-width:68ch}
.card.wide{max-width:none}
.card h3{font-family:var(--hand);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 6px;color:var(--ink)}
.card h4{margin:12px 0 4px;font-size:16px}
.card p{margin:0 0 8px}
.card ul,.card ol{margin:4px 0 8px;padding-left:22px}
.card li{margin:3px 0}
.kicker{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--tab);margin-bottom:2px}
.case{border-left:5px solid var(--tab)}
.safety{border-left:5px solid var(--red)}
.infobox{border-left:5px solid var(--ink)}
.lab{border-left:5px solid var(--green)}
.hint{font-size:14px;color:var(--muted)}
.q{font-weight:700;margin:10px 0 6px}
.opts{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.opts label{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border:2px solid var(--karo);border-radius:10px;background:var(--paper);cursor:pointer}
.opts label:hover{border-color:var(--tab)}
.opts input{margin-top:4px;accent-color:var(--tab);flex:none;width:18px;height:18px}
.opts label.ok{border-color:var(--green)}
.opts label.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--paper))}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.colors label{display:flex;align-items:center;gap:8px;border:2px solid var(--karo);border-radius:999px;padding:5px 12px 5px 6px;background:var(--paper);cursor:pointer}
.colors input{accent-color:var(--tab)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--text);flex:none}
textarea.free,input.free{width:100%;border:2px solid var(--karo);border-radius:10px;background:var(--paper);color:var(--ink);padding:9px 11px;font-size:16px;line-height:1.5}
textarea.free{min-height:84px;resize:vertical}
textarea.free:focus,input.free:focus{outline:none;border-color:var(--ink);background:var(--focus)}
textarea.free.ok,input.free.ok{border-color:var(--green)}
textarea.free.bad,input.free.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--paper))}
.flabel{display:block;font-weight:700;margin:10px 0 4px}
.check li{list-style:none;margin-left:-20px}
.check label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--tab);flex:none}

/* Moleküle */
.mols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0}
.mol{background:#fff;border:2px solid var(--text);border-radius:12px;padding:6px 6px 4px;box-shadow:3px 3px 0 var(--text);color:#25303f;position:relative}
.mol .cap{text-align:center;font-weight:700;font-size:15px;margin:2px 0 2px}
.mol .cap small{font-weight:400;color:#5b6677}
.mol svg{display:block;width:100%;height:auto;max-height:340px}
.mol.inter{outline:3px dashed var(--tab);outline-offset:3px}
.mol circle.hit{fill:transparent;stroke:transparent;cursor:pointer}
.mol circle.hit:hover{fill:rgba(28,63,160,.12)}
.mol circle.hit.on{fill:rgba(255,196,0,.55);stroke:#b08000;stroke-width:2}
.mol circle.hit.ok{fill:rgba(29,130,72,.35);stroke:#1d8248;stroke-width:2}
.mol circle.hit.bad{fill:rgba(207,47,42,.35);stroke:#cf2f2a;stroke-width:2}
.mol circle.hit.miss{fill:none;stroke:#cf2f2a;stroke-width:3;stroke-dasharray:5 4}
.fcbox{width:120px;margin:4px auto 2px;background:#fff;border:1px solid #cfdcec;border-radius:8px}
.fcbox svg{max-height:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* Umschlag */
.env{width:min(320px,100%);margin:14px auto 6px;position:relative;cursor:pointer;background:none;border:none;padding:0;display:block}
.env .body{height:180px;background:#e8d3a6;border:2px solid #7a5c2a;border-radius:6px;position:relative;overflow:hidden;box-shadow:4px 4px 0 #7a5c2a}
.env .body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to top right,#dcc391 50%,transparent 50.5%),linear-gradient(to top left,#dcc391 50%,transparent 50.5%);background-size:50% 100%;background-position:left bottom,right bottom;background-repeat:no-repeat}
.env .flap{position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(to bottom right,#d8bd86 50%,transparent 50.5%),linear-gradient(to bottom left,#d8bd86 50%,transparent 50.5%);background-size:50% 100%;background-position:left top,right top;background-repeat:no-repeat;transform-origin:top;transition:transform .6s;z-index:2}
.env .seal{position:absolute;left:50%;top:84px;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#b3261e;color:#fff;display:grid;place-items:center;font-family:var(--hand);font-size:26px;z-index:3;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.env .tag{position:absolute;left:12px;bottom:10px;z-index:3;font-family:var(--hand);font-size:22px;color:#4a3510}
.env.open .flap{transform:rotateX(180deg)}
.env.open .seal{opacity:0;transition:opacity .3s}
.env:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.6}

/* Zeitstrahl */
.tl{list-style:none;padding:0 0 0 18px;margin:8px 0;border-left:3px solid var(--tab)}
.tl li{position:relative;margin:0 0 10px;padding-left:10px}
.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--tab)}
.tl b.y{font-family:var(--hand);font-size:22px;color:var(--ink);font-weight:400;margin-right:6px}
.chain{font-family:var(--hand);font-size:22px;color:var(--ink);line-height:1.3}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini{background:var(--paper);border:2px solid var(--karo);border-radius:10px;padding:10px 12px}
.mini b{display:block;margin-bottom:3px}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 10px}
table.t th,table.t td{border:1.5px solid var(--karo);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:color-mix(in srgb,var(--tab) 14%,var(--paper))}

/* Rückmeldung & Knöpfe */
.work{position:relative}
.note{background:var(--paper);border:2px solid var(--karo);border-radius:12px;padding:12px 14px;margin:8px 0 12px;max-width:68ch}
.note:empty{display:none}
.note p{margin:0}
.note ul{margin:6px 0 0;padding-left:20px}
.note li{margin:4px 0}
.note.good{border-color:var(--green)} .note.good>p>strong:first-child{color:var(--green)}
.note.bad{border-color:var(--red)} .note.bad>p>strong:first-child{color:var(--red)}
.note.info{border-color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions.more{margin-top:14px;padding-top:12px;border-top:2px dashed var(--karo)}
.btn{border:2px solid var(--text);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:500;font-size:15px;box-shadow:2px 2px 0 var(--text);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--text)}
.btn.main{background:var(--tab);border-color:var(--tab);color:#fff;font-weight:700;box-shadow:2px 2px 0 var(--text)}
@media (prefers-color-scheme: dark){.btn.main{color:#121620}}
.btn:disabled{opacity:.4;cursor:default}
.stamp{position:absolute;right:4%;top:6px;transform:rotate(-14deg);border:4px double var(--red);color:var(--red);font-family:var(--hand);font-size:40px;padding:0 16px;border-radius:10px;background:color-mix(in srgb,var(--paper) 80%,transparent);pointer-events:none;animation:stamp .35s ease-out;z-index:5}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.solution{margin-top:16px}
.solution h2{font-family:var(--hand);font-weight:400;font-size:32px;margin:0;color:var(--ink);background:var(--paper);width:fit-content;padding:0 8px;border-radius:6px}
.soltext{background:var(--paper);border-left:4px solid var(--tab);padding:10px 14px;border-radius:0 10px 10px 0;max-width:68ch;line-height:1.7}
.soltext p{margin:0 0 8px}
.mark{background:var(--hl);padding:0 3px;border-radius:3px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--paper);border:2px solid var(--text);border-radius:14px;box-shadow:5px 5px 0 var(--text);padding:20px;max-width:520px;width:100%;max-height:100%;overflow:auto}
.modal h2{font-family:var(--hand);font-weight:400;font-size:32px;margin:0 0 6px;color:var(--ink)}
.modal.qrmodal{width:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.qrbox{background:#fff;padding:12px;border-radius:10px;border:2px solid var(--karo);line-height:0}
.qrbox svg{display:block;width:min(calc(100vw - 100px),calc(100vh - 250px),460px);height:auto;min-width:160px}
.qrurl{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere;user-select:all;max-width:460px}
textarea.export{width:100%;min-height:240px;font-size:13px;border:2px solid var(--karo);border-radius:10px;background:var(--paper);color:var(--text);padding:8px}

@media (max-width:700px){
  .tabs{margin-left:4px;gap:4px}
  .tab{padding:8px 9px 10px;font-size:14px}
  .tab .lg{display:none} .tab .sm{display:inline}
}
@media (max-width:560px){
  .inner{padding-left:22px}
  .sheet{padding-left:10px;padding-right:10px}
  .sheet::before{left:24px}
  .label h1{font-size:36px}
  .grouphead h2{font-size:28px}
  .card{padding:12px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="cover">
    <div class="brand">
      <button class="qrbtn" id="qrBtn" type="button" title="QR-Code zu dieser Seite zeigen" aria-label="QR-Code zu dieser Seite zeigen">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-2h2v2h-2zm2 2h2v2h-2zm2-2h2v2h-2zm2 2h2v2h-2zm-6 2h2v2h-2zm4 0h2v2h-2zm-2 2h2v2h-2zm4 2h2v2h-2z"/></svg>
      </button>
      <div class="label"><h1>Laborheft</h1><p>Kreuzreaktionen bei Substanztests · Forensik</p></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Gruppe">
    <button class="tab" role="tab" data-g="A"><span class="lg">A · Kokaintest</span><span class="sm">A</span></button>
    <button class="tab" role="tab" data-g="B"><span class="lg">B · LSD-Test</span><span class="sm">B</span></button>
    <button class="tab" role="tab" data-g="C"><span class="lg">C · LSD-Derivate</span><span class="sm">C</span></button>
    <button class="tab" role="tab" data-g="R">🔁<span class="lg"> Fehler-Training</span><span class="badge" id="revBadge">0</span></button>
  </nav>

  <section class="sheet">
    <div class="inner">
      <div class="grouphead"><h2 id="gTitle"></h2><span class="lvl" id="gStep"></span></div>
      <ol class="phases" id="phases"></ol>
      <div class="work" id="work"><div id="stepView"></div><div class="stamp hidden" id="stamp"></div></div>
      <div class="note" id="note" aria-live="polite"></div>
      <div class="actions" id="mainActions">
        <button class="btn" id="backBtn">◀ Zurück</button>
        <button class="btn main" id="checkBtn">✓ Prüfen</button>
        <button class="btn main hidden" id="nextBtn">Weiter ▶</button>
      </div>
      <div class="actions more" id="moreActions">
        <button class="btn" id="solBtn">👀 Musterlösung</button>
        <button class="btn" id="resetBtn">↺ Nochmal von vorn</button>
        <button class="btn" id="exportBtn">📋 Antworten kopieren</button>
      </div>
      <div class="solution hidden" id="solution">
        <h2>Musterlösung</h2>
        <div class="soltext" id="solText"></div>
        <div class="actions" style="margin-top:10px"><button class="btn" id="solClose">Musterlösung schließen</button></div>
      </div>
    </div>
  </section>
</main>

<div class="overlay hidden" id="qrOverlay">
  <div class="modal qrmodal" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <h2 id="qrTitle">Laborheft öffnen</h2>
    <div class="qrbox" id="qrBox"></div>
    <p class="qrurl" id="qrUrl"></p>
    <div class="actions" style="justify-content:center"><button class="btn main" id="qrClose">Schließen</button></div>
  </div>
</div>
<div class="overlay hidden" id="expOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="expTitle">
    <h2 id="expTitle">Eure Antworten</h2>
    <p class="hint">Der Text ist schon kopiert. Ihr könnt ihn z. B. in ein Dokument oder bei IServ einfügen. Falls das Kopieren nicht geklappt hat: Text markieren und kopieren.</p>
    <textarea class="export" id="expText" readonly></textarea>
    <div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="btn main" id="expClose">Schließen</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

const INFOTEXT = `<div class="card wide"><span class="kicker">Infotext</span><h3>Wenn der Test sich irrt</h3>
<p class="mark" style="display:inline">Ein Farbtest „erkennt“ nie ein ganzes Molekül, sondern nur <b>ein bestimmtes Strukturmerkmal</b>. Jeder Stoff mit diesem Merkmal kann die gleiche Farbe auslösen – das nennt man <b>Kreuzreaktion</b>.</p>
<h4>Vortest ist nicht Beweis</h4>
<p>Polizei, Zoll und Drug-Checking-Projekte arbeiten vor Ort mit Schnelltests: ein bisschen Probe, ein paar Tropfen Reagenz – und nach Sekunden zeigt eine Farbe an, ob ein Verdacht besteht. Forensiker nennen solche Verfahren <b>Vortests</b>. Sie sind billig, schnell und brauchen kein Labor. Ihr großer Nachteil: Sie sind nicht <b>spezifisch</b>.</p>
<table class="t"><tr><th>Begriff</th><th>Bedeutung</th></tr>
<tr><td><b>Sensitivität</b></td><td>Wie zuverlässig erkennt der Test den gesuchten Stoff, auch in kleiner Menge?</td></tr>
<tr><td><b>Spezifität</b></td><td>Wie zuverlässig reagiert der Test <i>nur</i> auf den gesuchten Stoff?</td></tr>
<tr><td><b>falsch positiv</b></td><td>Der Test zeigt „Droge“, obwohl keine vorhanden ist.</td></tr>
<tr><td><b>falsch negativ</b></td><td>Der Test zeigt „keine Droge“, obwohl eine vorhanden ist.</td></tr></table>
<h4>Warum es zu Kreuzreaktionen kommt</h4>
<p>Die Farbreaktion läuft immer an einer bestimmten Stelle des Moleküls ab. Der <b>Kokaintest</b> (Scott-Test) enthält Cobalt(II)-thiocyanat. Er reagiert mit organischen Kationen, die ein Stickstoffatom tragen – egal, ob dieses Kation zu Kokain gehört oder zu einem Arzneistoff. Der <b>LSD-Test</b> (Ehrlich-Reagenz) reagiert mit dem <b>Indol-Ring</b>, den LSD mit vielen Naturstoffen teilt: mit Mutterkornalkaloiden, mit Tryptaminen wie DMT oder Psilocin und sogar mit dem Hormon Serotonin.</p>
<div class="grid3">
 <div class="mini"><b>Kokaintest</b>Lidocain (Streckmittel, Betäubung beim Zahnarzt), Procain, Diphenhydramin, N-Butylscopolamin (Buscopan®)</div>
 <div class="mini"><b>LSD-Test</b>alle Indol-Verbindungen, z. B. Ergotamin, Psilocin, DMT, Tryptamin</div>
 <div class="mini"><b>Urin-Schnelltests</b>Pseudoephedrin → Amphetamin-Test, bestimmte Antibiotika (Chinolone) → Opiat-Test</div>
</div>
<h4>Folgen für Toxikologie und Verbrechensaufklärung</h4>
<p>Ein falsch positives Ergebnis kann einen Unschuldigen in Verdacht bringen: Durchsuchung, vorläufige Festnahme, Führerscheinentzug, Ärger mit dem Arbeitgeber. In Houston (Texas) deckten Journalisten 2016 auf, dass rund 300 Menschen wegen Drogenbesitzes verurteilt worden waren, obwohl das Kriminallabor später gar keine Drogen fand. Viele hatten sich nach einem positiven Feldtest schuldig bekannt, um schneller aus der Untersuchungshaft zu kommen. Die Polizei in Houston hat die Feldtests danach abgeschafft.</p>
<p>In Deutschland begründet ein Schnelltest nur einen <b>Anfangsverdacht</b>. Vor Gericht zählt die <b>Bestätigungsanalyse</b> im Labor, meist mit Chromatographie und Massenspektrometrie (GC-MS, LC-MS/MS). Auch die Rechtsmedizin arbeitet nach dem Zwei-Säulen-Prinzip: Ein Suchtest gibt Hinweise, eine zweite, unabhängige Methode bestätigt.</p>
<p>Wer Kreuzreaktionen kennt, kann sie aber auch nutzen: gezielt weitere Tests einsetzen – und Verdächtige schneller entlasten.</p></div>`;

const KATZ = `<div class="card wide"><span class="kicker">Text</span><h3>Das Katz-und-Maus-Spiel</h3>
<p><span class="mark">Ein bekannter Wirkstoff wird minimal verändert – rechtlich ist es ein neuer Stoff, im Körper wirkt er fast gleich.</span></p>
<h4>Das Prinzip</h4>
<p>Drogengesetze funktionierten lange so, dass jeder verbotene Stoff einzeln mit Namen aufgelistet wurde. Hersteller nutzen das aus: Sie verändern das Molekül einer bekannten Droge an einer kleinen Stelle. Das Ergebnis ist chemisch ein neuer Stoff, der in keiner Liste steht – also zunächst nicht verboten. Solche Stoffe heißen <b>neue psychoaktive Stoffe (NPS)</b>, umgangssprachlich „Legal Highs“ oder Designerdrogen. Die EU-Drogenagentur beobachtet inzwischen rund 1.000 solcher Stoffe.</p>
<h4>Beispiel: die LSD-Derivate</h4>
<ul><li><b>LSD</b> (C<sub>20</sub>H<sub>25</sub>N<sub>3</sub>O) steht im Betäubungsmittelgesetz und ist verboten.</li>
<li><b>1P-LSD</b> (C<sub>23</sub>H<sub>29</sub>N<sub>3</sub>O<sub>2</sub>): Am Stickstoffatom des Indol-Rings hängt eine kleine Propionylgruppe. Seit etwa 2015 wird der Stoff online verkauft.</li>
<li>Im Körper wird diese Gruppe wieder abgespalten – 1P-LSD wirkt als <b>Prodrug</b>, also als „Vorstufe“, aus der der Körper selbst LSD herstellt.</li>
<li>Verkauft wurden die Stoffe über Onlineshops, deklariert als „Forschungschemikalie“ oder „nicht zum Verzehr“ – obwohl jedem klar ist, wofür sie gekauft werden. In Berlin gab es sogar Läden, die sie offen verkauften.</li></ul>
<h4>Wird eine Variante verboten, kommt die nächste</h4>
<p class="chain">1P-LSD → 1cP-LSD → 1V-LSD → 1D-LSD → 1S-LSD → 1Fe-LSD → …</p>
<ol class="tl">
<li><b class="y">ab 2015</b>1P-LSD wird online verkauft.</li>
<li><b class="y">2016</b>Das <b>Neue-psychoaktive-Stoffe-Gesetz (NpSG)</b> tritt in Kraft. Es verbietet ganze Stoffgruppen – beschreibt sie aber über genaue Molekülstrukturen.</li>
<li><b class="y">2022</b>1V-LSD wird vom NpSG erfasst. Im selben Jahr gibt es eine Razzia bei einem niederländischen Labor (Lizard Labs), das mehrere Varianten nacheinander entwickelt hat.</li>
<li><b class="y">2024</b>1D-LSD wird verboten. Als Ersatz erscheint <b>1S-LSD</b> mit einer siliciumhaltigen Gruppe. Lizard Labs lässt sich 1Fe-LSD patentieren.</li>
<li><b class="y">2025</b>Der Bundesrat fordert, LSD-Derivate so allgemein zu erfassen, dass kleine Veränderungen nicht mehr reichen. Die Bundesregierung ergänzt stattdessen gezielt neue Stoffe – darunter 1S-LSD (Ende 2025). Im November taucht in Deutschland <b>1Fe-LSD</b> auf, mit einem eisenhaltigen Ferrocen-Rest.</li>
<li><b class="y">2026</b>1Fe-LSD ist nach Händlerangaben noch nicht erfasst – das kann sich jederzeit ändern.</li></ol>
<h4>Weitere Beispiele für NPS</h4>
<div class="grid3">
 <div class="mini"><b>Synthetische Cannabinoide</b>auf Kräuter gesprüht, als „Räuchermischung“ verkauft (z. B. „Spice“, ab ca. 2008). Teils viel stärker als THC – Herzrasen, Psychosen, Todesfälle.</div>
 <div class="mini"><b>Synthetische Cathinone</b>als „Badesalz“ oder „Pflanzendünger“ getarnt.</div>
 <div class="mini"><b>Nitazene</b>synthetische Opioide, teils deutlich stärker als Fentanyl; zunehmend in Heroin oder gefälschten Tabletten.</div>
</div>
<h4>Was das für Toxikologie und Ermittlungen bedeutet</h4>
<ul><li><b>Vor Ort:</b> Schnelltests sind auf bekannte Strukturen zugeschnitten. Ist genau die Reaktionsstelle verändert, bleibt der Test negativ.</li>
<li><b>Im Labor:</b> Neue Stoffe fehlen in den Spektrenbibliotheken. Vergleichssubstanzen müssen erst beschafft, Strukturen teils aufwendig aufgeklärt werden (z. B. mit NMR-Spektroskopie).</li>
<li><b>Im Körper:</b> Prodrugs werden schnell zu LSD umgewandelt, und die Dosen liegen im Mikrogrammbereich. Im Blut findet man winzige Mengen – meist nur LSD. Was wirklich eingenommen wurde, ist schwer zu klären.</li>
<li><b>Falsche Etiketten:</b> In Japan steckte in Papierstücken mit der Aufschrift „1D-LSD“ ein ganz anderes Derivat (1T-LSD). Konsumierende wissen oft selbst nicht, was sie nehmen – Notärzte ebenso wenig.</li>
<li><b>Vor Gericht:</b> Ob ein Stoff unter das BtMG, das NpSG oder unter gar kein Gesetz fällt, entscheidet über die Strafbarkeit. Das Gesetz kann immer erst reagieren, wenn ein neuer Stoff aufgetaucht ist.</li></ul></div>`;

    sol: "<p>Das Ehrlich-Reagenz greift den <b>Indol-Ring</b> an. Ergotamin und LSD stammen beide von der Lysergsäure ab und haben ein identisches Ring-Grundgerüst (Ergolin) mit Indol-Ring. Deshalb läuft dieselbe Farbreaktion ab → <b>Kreuzreaktion</b>, falsch positives Ergebnis.</p><p>Der Test hat chemisch <b>korrekt</b> angezeigt, was er prüft: einen reaktionsfähigen Indol-Ring. Falsch war unsere Schlussfolgerung „Indol = LSD“. Der Test ist <b>sensitiv, aber nicht spezifisch</b>.</p><p><i>Wusstet ihr …?</i> Ergotamin wurde 1918 bei Sandoz in Basel isoliert. Dort forschte später Albert Hofmann an Mutterkornalkaloiden – und stellte 1938 erstmals LSD her.</p>" },
  { id: "info", t: "Infotext", type: "read", html: () => INFOTEXT },
  { id: "quiz", t: "Wissens-Check", type: "mc", quiz: true, qs: [

      { id: "B-q2", q: "Welcher Stoff würde den LSD-Test ebenfalls violett färben?", o: ["Psilocin aus „Zauberpilzen“", "Kokain", "Koffein", "Ethanol"], c: 0, why: "Psilocin ist ein Tryptamin und enthält einen Indol-Ring." },
      { id: "B-q3", q: "Unser Ergo-Kranit-Ergebnis war …", o: ["richtig positiv", "falsch positiv", "falsch negativ"], c: 1, why: "Der Test zeigte „LSD“, obwohl keines vorhanden war." },
      { id: "B-q4", q: "Was bedeutet „Spezifität“ eines Tests?", o: ["Er erkennt schon kleinste Mengen.", "Er reagiert nur auf den gesuchten Stoff.", "Er ist besonders schnell."], c: 1, why: "Sensitiv = erkennt kleine Mengen; spezifisch = nur der gesuchte Stoff." },
      { id: "B-q5", q: "Warum sind Ergotamin und LSD so ähnlich?", o: ["Beide werden aus Kokain hergestellt.", "Beide leiten sich von der Lysergsäure aus dem Mutterkornpilz ab.", "Zufall."], c: 1, why: "Beide sind Lysergsäure-Abkömmlinge (Ergolin-Gerüst)." } ] },

C: { name: "Negativ – also kein LSD?", short: "C", steps: [
  { id: "fall", t: "Fall", type: "info", html: () => `<div class="card case"><span class="kicker">Der Fall</span><h3>Paketkontrolle beim Zoll</h3><p>In einer Sendung aus den Niederlanden liegen winzige Tabletten in einem Tütchen mit der Aufschrift <b>„1S-LSD“</b> bzw. <b>„1Fe-LSD“</b> und dem Hinweis <i>„Forschungschemikalie – nicht zum Verzehr“</i>. Der Name klingt nach LSD. Ein Zollbeamter macht vor Ort einen LSD-Schnelltest.</p></div>` },
  { id: "versuch", t: "Versuch", type: "checklist", choose: true, html: () => `<div class="card"><span class="kicker">Material</span><p>ESA-Substanztest „LSD“ mit Anleitung, <b>eine</b> Tablette, Mörser mit Pistill, Spatel, Unterlage, Schutzbrille, Handschuhe, Abfallbehälter</p>
     <p class="q">Es gibt nur wenige Tabletten – entscheidet euch: Wir untersuchen …</p><div class="opts" id="chooseBox"><label><input type="radio" name="choose" value="1s-lsd"> <span><b>1S-LSD</b></span></label><label><input type="radio" name="choose" value="1fe-lsd"> <span><b>1Fe-LSD</b></span></label></div></div>
     ${SAFETY("Die Tablette enthält einen psychoaktiven Stoff, der schon in Mikrogramm-Mengen wirkt. Nur unter Aufsicht mörsern, keinen Staub erzeugen, Mörser und Unterlage danach feucht abwischen. Reste gibt die Lehrkraft zurück.")}`,
    items: ["Schutzbrille und Handschuhe sind an.", "Wir haben die Tablette vorsichtig im Mörser zerrieben.", "Wir haben die Anleitung vollständig gelesen und den Test genau danach durchgeführt.", "Wir haben die angegebene Wartezeit vollständig abgewartet."] },
  { id: "beob", t: "Beobachtung", type: "observe", expect: "keine", alt: ["orange"], posText: "eine <b>intensive Violettfärbung</b>" },
  { id: "deutung", t: "Deutung", type: "mc", qs: [
      { id: "C-d1", q: "Was würde der Zollbeamte aus dem Ergebnis schließen?", o: ["„Das ist LSD.“", "„Kein LSD – vermutlich harmlos.“", "„Der Test ist kaputt.“"], c: 1, why: "Laut Anleitung ist der Test negativ." },
      { id: "C-d2", q: "Wie nennt man ein solches Ergebnis, wenn doch ein (LSD-ähnliches) Rauschmittel vorliegt?", o: ["falsch positiv", "falsch negativ", "richtig negativ"], c: 1, why: "Der Test zeigt „nichts“, obwohl ein Rauschmittel vorhanden ist." } ],
    texts: [{ id: "folge", label: "Was würde der Zollbeamte vermutlich mit der Sendung tun – und warum ist das ein Problem?", min: 30, kw: [["weiter", "zustell", "freigeb", "durchlass", "nichts", "laufen"], ["rausch", "droge", "gefahr", "lsd", "wirk"]], hint: "Was passiert mit einem Paket ohne Verdacht – und was steckt tatsächlich drin?" }],
    sol: "<p>Der Test bleibt farblos (bzw. zeigt nur die orange Eigenfarbe von 1Fe-LSD). Der Zollbeamte notiert „kein LSD“; ohne weiteren Verdacht geht die Sendung womöglich weiter. Tatsächlich enthält sie ein im Körper LSD-ähnlich wirkendes Rauschmittel → <b>falsch negativ</b>.</p>" },
  { id: "hypos", t: "Hypothesen", type: "texts", pre: () => `<div class="card"><span class="kicker">Auf Spurensuche</span><h3>Warum bleibt der Test farblos?</h3><p>Stellt mindestens <b>zwei</b> Hypothesen auf, warum der Test negativ ist, obwohl die Tablette ein LSD-Derivat enthält. Notiert jeweils, wie man die Hypothese überprüfen könnte.</p></div>`,
    texts: [{ id: "h1", label: "Hypothese 1 – und so könnte man sie überprüfen", min: 30, kw: [] }, { id: "h2", label: "Hypothese 2 – und so könnte man sie überprüfen", min: 30, kw: [] }],
    sol: "<p><b>Mögliche Hypothesen:</b> zu wenig Substanz; Test defekt oder abgelaufen; Wartezeit zu kurz; Tablettenhilfsstoffe stören; die Tablette enthält gar keinen Indol-Stoff; das Molekül ist <b>an der Reaktionsstelle verändert</b>.</p><p><b>Überprüfen:</b> Mit einer <b>Positivkontrolle</b>: Gruppe B hat mit demselben Reagenz und Ergotamin (gleiches Indol-Gerüst) eine Violettfärbung bekommen – das Reagenz funktioniert. Die Menge ist kein guter Grund: Der Test ist für LSD-Pappen mit etwa 100 µg gebaut, eure Tablette enthält eine ähnliche Menge. Bleibt die Struktur – das untersucht ihr jetzt.</p>" },
  { id: "struktur", t: "Strukturvergleich", type: "mark", ref: "lsd_c", refCap: "LSD", mol: "@choice", molCap: "@choice",
    task: "Vergleicht LSD mit eurem Derivat. <b>Tippt bei eurem Derivat alle Atome an, die es im LSD nicht gibt.</b> Ihr könnt ein Atom durch erneutes Antippen wieder abwählen.",
    rule: { maxMiss: 1, maxExtra: 1, fe0: true },
    done: "Der einzige Unterschied: Am Stickstoffatom <b>N1</b> des Indol-Rings sitzt statt eines H-Atoms eine <b>Acylgruppe</b> (R–C=O). <span style='color:#4a8ad8'>●</span> N1 &nbsp;<span style='color:#e070b0'>●</span> C2 – die Stelle, an der der LSD-Test angreift." },
  { id: "erkl", t: "Erklärung", type: "mc", pre: () => `<div class="card infobox"><span class="kicker" style="color:var(--ink)">Wo der LSD-Test angreift</span><p>Das Ehrlich-Reagenz ist ein <b>Elektrophil</b>. Es reagiert in einer elektrophilen Substitution mit dem <b>Indol-Ring</b>: bei LSD am Kohlenstoffatom <b>C2</b> direkt neben dem Ring-Stickstoff <b>N1</b>.</p><p>Ein Elektrophil reagiert umso leichter, je <b>elektronenreicher</b> die Angriffsstelle ist. Im Indol-Ring schiebt das freie Elektronenpaar von N1 Elektronendichte in den Ring (+M-Effekt).</p></div>`,
    qs: [{ id: "C-e1", q: "Welche funktionelle Gruppe entsteht am N1, wenn dort eine Acylgruppe (R–C=O) gebunden ist?", o: ["Ester", "Amid", "Ether", "Carbonsäure"], c: 1, why: "N–C(=O)–R ist eine Amidgruppe." },
      { id: "C-e2", q: "Was passiert mit dem freien Elektronenpaar von N1?", o: ["Es wird zusätzlich in die C=O-Gruppe gezogen (Amid-Mesomerie) und steht dem Ring weniger zur Verfügung.", "Es wird verdoppelt.", "Es bleibt völlig unverändert."], c: 0, why: "Die Carbonylgruppe zieht Elektronendichte ab (−M-Effekt)." },
      { id: "C-e3", q: "Welcher zweite Effekt erschwert den Angriff an C2 zusätzlich?", o: ["Die Acylgruppe ist sperrig und schirmt C2 räumlich ab (sterischer Effekt).", "Die Tablette ist zu hart.", "Das Reagenz verdampft."], c: 0, why: "Trimethylsilyl-Gruppe bzw. Ferrocen-„Sandwich“ sitzen direkt neben C2." }],
    texts: [{ id: "erkl", label: "Erklärt jetzt mit eigenen Worten, warum der Test bei eurem Derivat negativ bleibt.", min: 80, kw: [["elektronen", "mesomer", "-m", "elektronenarm", "elektronendichte"], ["c=o", "carbonyl", "acyl", "amid"], ["steri", "sperrig", "platz", "verdeck", "abschirm", "gross"]], hint: "Eine gute Erklärung nennt die Elektronenverteilung (Amid, C=O) und den Platzbedarf der Gruppe." }],
    sol: "<p><b>Elektronischer Effekt (Hauptgrund):</b> Bei LSD steht das freie Elektronenpaar von N1 dem Ring zur Verfügung und macht C2 elektronenreich. Bei den Derivaten wird es zusätzlich in die C=O-Gruppe gezogen (Amid-Mesomerie: N–C=O ↔ N<sup>+</sup>=C–O<sup>−</sup>). Der Ring wird <b>elektronenärmer</b>, das Elektrophil greift C2 kaum noch an. Auch der violette Farbstoff (ein mesomeriestabilisiertes Kation) wäre weniger stabil.</p><p><b>Sterischer Effekt (verstärkend):</b> Die sperrige Trimethylsilyl-Gruppe bzw. das Ferrocen-„Sandwich“ sitzt direkt neben C2 und <b>verdeckt</b> die Angriffsstelle.</p>" },
  { id: "muster", t: "Musterlösung", type: "read", html: () => `<div class="card wide lab"><span class="kicker" style="color:var(--green)">Umschlag C · Musterlösung</span><h3>Vergleicht mit euren Hypothesen</h3>
     <p><b>Unterschied:</b> Das Grundgerüst ist identisch. Bei LSD trägt N1 ein H-Atom. Bei 1S-LSD ist dort eine 3-(Trimethylsilyl)propanoyl-Gruppe gebunden, bei 1Fe-LSD eine Ferrocenylcarbonyl-Gruppe. Beides sind <b>Acylgruppen</b> – N1 wird Teil einer <b>Amidgruppe</b>.</p>
     <p><b>1. Elektronischer Effekt:</b> Das freie Elektronenpaar von N1 wird in die C=O-Gruppe gezogen. Der Indol-Ring wird elektronenärmer, C2 wird vom Elektrophil kaum noch angegriffen.</p>
     <p><b>2. Sterischer Effekt:</b> Die große Gruppe sitzt direkt neben C2 und verdeckt die Angriffsstelle.</p>
     <p><b>Gut zu wissen:</b> In der sauren Testlösung wird die Acylgruppe sehr langsam abgespalten. Lässt man den Test lange stehen, kann doch eine schwache Färbung entstehen. Im Körper geht die Abspaltung schnell – es entsteht LSD. Die Derivate sind <b>Prodrugs</b>. Drug-Checking-Labore haben das an den Vorgängern 1P-LSD und 1B-LSD beobachtet: Beide färben das Ehrlich-Reagenz nicht violett, LSD dagegen schon.</p></div>`,
    checks: ["Wir hatten den Unterschied am N1 (Acyl- bzw. Amidgruppe) erkannt.", "Wir hatten den elektronischen Effekt (Elektronenpaar, C=O) erklärt.", "Wir hatten den sterischen Effekt (Platzbedarf) genannt.", "Wir haben unsere Antworten in einer anderen Farbe ergänzt."] },
  { id: "katz", t: "Katz & Maus", type: "read", html: () => KATZ },
  { id: "summe", t: "Zusammenfassung", type: "texts", pre: () => `<div class="card"><span class="kicker">Auswertung</span><h3>Schwierigkeiten zusammenfassen</h3><p>Fasst zusammen, welche Schwierigkeiten falsch negative Substanztests und neue psychoaktive Stoffe verursachen.</p></div>`,
    texts: [{ id: "s1", label: "für die Polizei / den Zoll vor Ort", min: 40, kw: [["negativ", "uebersehen", "nicht erkannt", "falsch"], ["schnelltest", "vortest", "test"]], hint: "Was zeigt der Schnelltest – und was folgt daraus?" },
      { id: "s2", label: "für die forensische Toxikologie (Labor, Rechtsmedizin)", min: 40, kw: [["bibliothek", "referenz", "vergleich", "unbekannt", "neu"], ["prodrug", "lsd", "umgewandelt", "abgespalten", "mikrogramm", "menge", "gering"]], hint: "Denkt an Vergleichsdaten im Labor und an das, was im Blut übrig bleibt." },
      { id: "s3", label: "für Gesetzgebung und Justiz", min: 40, kw: [["gesetz", "npsg", "btmg", "verbot", "liste"], ["hinterher", "neu", "veraender", "umgeh", "luecke", "naechste"]], hint: "Warum ist der Gesetzgeber immer einen Schritt zu spät?" },
      { id: "s4", label: "Warum könnten Hersteller ein Interesse an Veränderungen genau am N1-Atom haben?", min: 30, kw: [["test", "nachweis", "erkannt", "farblos", "negativ"], ["gesetz", "legal", "verbot", "prodrug", "wirk"]], hint: "Zwei Vorteile: Gesetz und Schnelltest." }],
    sol: "<p><b>Vor Ort:</b> Schnelltests sind auf bekannte Strukturen zugeschnitten; ist die Reaktionsstelle verändert, bleibt der Test negativ → Rauschmittel werden übersehen, Sendungen nicht weiter untersucht.</p><p><b>Toxikologie:</b> Neue Stoffe fehlen in Spektrenbibliotheken, Referenzsubstanzen müssen erst beschafft werden. Prodrugs werden im Körper rasch zu LSD; bei Mikrogramm-Dosen findet man winzige Mengen, meist nur LSD – was eingenommen wurde, bleibt unklar. Falsch beschriftete Produkte erschweren alles zusätzlich.</p><p><b>Gesetz und Justiz:</b> Verboten ist nur, was in BtMG oder NpSG erfasst ist. Jede kleine Veränderung schafft einen neuen Stoff, das Gesetz reagiert erst danach → Katz-und-Maus-Spiel.</p><p><b>N1:</b> Eine Acylgruppe am N1 wird im Körper abgespalten (die Wirkung bleibt), umgeht die Strukturbeschreibung im Gesetz <i>und</i> lässt den Ehrlich-Test farblos.</p>" },
  { id: "quiz", t: "Wissens-Check", type: "mc", quiz: true, qs: [
      { id: "C-q1", q: "Was unterscheidet 1S-LSD und 1Fe-LSD von LSD?", o: ["Eine Acylgruppe am Indol-Stickstoff N1", "Ein fehlender Indol-Ring", "Ein zusätzliches Chloratom"], c: 0, why: "Nur am N1 ist das H-Atom durch eine Acylgruppe ersetzt." },
      { id: "C-q2", q: "Was ist ein Prodrug?", o: ["Ein besonders starkes Medikament", "Eine Vorstufe, aus der der Körper den eigentlichen Wirkstoff herstellt", "Ein Drogentest für Profis"], c: 1, why: "Die Acylgruppe wird im Körper abgespalten – es entsteht LSD." },

      { id: "C-q4", q: "Welches Gesetz verbietet in Deutschland ganze Gruppen neuer psychoaktiver Stoffe?", o: ["BtMG", "NpSG", "StVO"], c: 1, why: "Das Neue-psychoaktive-Stoffe-Gesetz (seit 2016)." },
      { id: "C-q5", q: "Warum ist der Nachweis im Blut nach Einnahme eines LSD-Derivats schwierig?", o: ["Die Derivate werden schnell zu LSD umgewandelt, und die Mengen sind winzig.", "Blut kann man nicht untersuchen.", "Die Derivate färben das Blut."], c: 0, why: "Prodrug + Mikrogramm-Dosen." } ] },
  { id: "praes", t: "Präsentation", type: "texts", pre: () => `<div class="card"><span class="kicker">Zum Schluss</span><h3>Präsentation vorbereiten</h3><p>Bereitet eine kurze Präsentation (ca. 3 Minuten) vor: <b>Fall → Testergebnis → Strukturvergleich → Erklärung → Katz-und-Maus-Spiel</b>. Nehmt Stellung: Der Bundesrat wollte LSD-Derivate über ein allgemeines Grundgerüst verbieten. Nennt je ein Argument dafür und dagegen.</p></div>`,

/* ---------- Zustand ---------- */
let S;
function freshGroup() { return { step: 0, done: {}, first: {}, tried: {}, ans: {}, opened: false, choice: null, marks: {} }; }
function load() {
  try { S = JSON.parse(localStorage.getItem(STORE)) || null; } catch (e) { S = null; }
  if (!S || !S.g) S = { cur: "A", g: { A: freshGroup(), B: freshGroup(), C: freshGroup() }, rev: [] };
  for (const k of "ABC") if (!S.g[k]) S.g[k] = freshGroup();
  if (!Array.isArray(S.rev)) S.rev = [];
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { } }

const QS = {}; for (const k of "ABC") for (const st of G[k].steps) for (const q of (st.qs || [])) QS[q.id] = { ...q, g: k };

/* ---------- Anzeige ---------- */
let solOpen = false, revIdx = 0;
function setTabColor(k) { document.documentElement.style.setProperty("--tab", k === "R" ? "var(--rev)" : `var(--g${k})`); }
function renderStats() {
  const el = $("stats"); el.innerHTML = "";
  for (const k of "ABC") {
    const g = S.g[k], n = G[k].steps.length, d = Object.keys(g.done).length;
    const f = Object.values(g.first).filter(Boolean).length;
    el.insertAdjacentHTML("beforeend", `<span class="stat"><span class="dot" style="background:var(--g${k})"></span><b>${k}</b> ${d}/${n} erledigt · ${f} auf Anhieb</span>`);
  }
  $("revBadge").textContent = S.rev.length;
}
function renderTabs() { document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.g === S.cur ? "true" : "false")); }

function render() {
  renderTabs(); renderStats(); setTabColor(S.cur);
  $("stamp").classList.add("hidden"); hideSol();
  if (S.cur === "R") return renderReview();
  $("moreActions").classList.remove("hidden"); $("backBtn").classList.remove("hidden");
  const k = S.cur, grp = G[k], g = S.g[k], st = grp.steps[g.step];
  $("gTitle").textContent = `Gruppe ${k}: ${grp.name}`;
  $("gStep").textContent = `Schritt ${g.step + 1} von ${grp.steps.length}`;
  const ph = $("phases"); ph.innerHTML = "";
  grp.steps.forEach((s, i) => {
    const unlocked = i === 0 || g.done[grp.steps[i - 1].id];
    const cls = i === g.step ? "now" : g.done[s.id] ? "done" : unlocked ? "" : "locked";
    ph.insertAdjacentHTML("beforeend", `<li class="${cls}"><button type="button" data-i="${i}" ${unlocked ? "" : "disabled aria-disabled='true'"}>${g.done[s.id] ? "✓ " : (i + 1) + " "}${s.t}</button></li>`);
  });
  ph.querySelectorAll("button:not([disabled])").forEach(b => b.onclick = () => { g.step = +b.dataset.i; save(); render(); });
  const v = $("stepView"); v.innerHTML = buildStep(k, st, g);
  wireStep(k, st, g);
  setNote(g.done[st.id] ? doneNote(st) : "", g.done[st.id] ? "good" : "");
  $("checkBtn").textContent = ({ info: "✓ Gelesen", read: "✓ Gelesen", envelope: "✓ Gelesen" })[st.type] || "✓ Prüfen";
  $("checkBtn").classList.toggle("hidden", !!g.done[st.id]);
  $("nextBtn").classList.toggle("hidden", !g.done[st.id] || g.step === grp.steps.length - 1);
  $("backBtn").disabled = g.step === 0;
  $("solBtn").classList.toggle("hidden", !st.sol && st.type !== "mark");
  if (st.type === "envelope" && !g.opened) $("checkBtn").classList.add("hidden");
}
function doneNote(st) {
  if (st.type === "mark") return `<p><strong>Erledigt.</strong> ${st.done}</p>`;
  return `<p><strong>Erledigt.</strong> Weiter geht's mit dem nächsten Schritt.</p>`;
}
function setNote(html, cls) { const n = $("note"); n.className = "note" + (cls ? " " + cls : ""); n.innerHTML = html; }

function molBox(key, cap, interactive, hl, k) {
  const m = MOL[key]; if (!m) return "";
  let svg = hl ? m.hl : m.plain;
  if (interactive) {
    const circles = m.atoms.map((a, i) => `<circle class="hit" data-i="${i}" cx="${a[0]}" cy="${a[1]}" r="18"><title>Atom ${a[2]}</title></circle>`).join("");
    svg = svg.replace(/<\/svg>\s*$/, circles + "</svg>");
  }
  const fc = key.startsWith("1fe") ? `<div class="fcbox" title="Fc = Ferrocenyl">${FC_SVG}</div>` : "";
  return `<div class="mol ${interactive ? "inter" : ""}" data-key="${key}">${svg}<div class="cap">${cap}</div>${fc}</div>`;
}
function choiceName(c) { return c === "1fe-lsd" ? "1Fe-LSD <small>(Fc = Ferrocenyl)</small>" : "1S-LSD"; }

function buildStep(k, st, g) {
  const A = g.ans; let h = "";
  if (st.pre) h += st.pre();
  switch (st.type) {
    case "info": case "read": h += st.html();
      if (st.checks) h += `<div class="card"><span class="kicker">Selbstkontrolle</span><ul class="check">${st.checks.map((c, i) => `<li><label><input type="checkbox" data-c="${i}" ${A[st.id + "_c" + i] ? "checked" : ""}> <span>${c}</span></label></li>`).join("")}</ul></div>`;
      break;
    case "checklist": h += st.html() + `<div class="card"><span class="kicker">Versuchsdurchführung</span><p>Führt den Test <b>genau nach der beiliegenden Anleitung</b> durch und hakt ab:</p><ul class="check">${st.items.map((c, i) => `<li><label><input type="checkbox" data-c="${i}" ${A[st.id + "_c" + i] ? "checked" : ""}> <span>${c}</span></label></li>`).join("")}</ul></div>`; break;
    case "observe": h += `<div class="card"><span class="kicker">Beobachtung</span><p>Laut Anleitung bedeutet ${st.posText} ein positives Ergebnis.</p>
       <p class="q">Welche Farbe zeigt euer Test nach der Wartezeit?</p><div class="colors">${COLORS.map(c => `<label><input type="radio" name="col" value="${c.v}" ${A.col === c.v ? "checked" : ""}><span class="sw" style="background:${c.c}"></span>${c.t}</label>`).join("")}</div>
       <label class="flabel" for="t_time">Nach wie vielen Sekunden/Minuten habt ihr die Farbe beurteilt?</label><input class="free" id="t_time" data-t="time" value="${esc(A.time || "")}" placeholder="z. B. nach 1 Minute">
       <label class="flabel" for="t_obs">Beschreibt genau, was ihr seht (vorher → nachher):</label><textarea class="free" id="t_obs" data-t="obs" placeholder="Vorher war die Flüssigkeit …, nach Zugabe der Probe …">${esc(A.obs || "")}</textarea></div>`; break;
    case "mc": case "texts":
      for (const q of (st.qs || [])) h += `<div class="card"><p class="q">${q.q}</p><div class="opts">${q.o.map((o, i) => `<label data-q="${q.id}" data-i="${i}"><input type="radio" name="${q.id}" value="${i}" ${A[q.id] == i ? "checked" : ""}> <span>${o}</span></label>`).join("")}</div></div>`;
      if (st.texts && st.texts.length) h += `<div class="card">${st.texts.map(t => `<label class="flabel" for="t_${t.id}">${t.label}</label><textarea class="free" id="t_${t.id}" data-t="${t.id}">${esc(A[t.id] || "")}</textarea>`).join("")}</div>`;
      break;
    case "envelope":
      h += `<p class="hint" style="text-align:center">${g.opened ? "Der Umschlag ist geöffnet – lest den Laborbefund." : g.done.deutung ? "Tippt auf den Umschlag, um ihn zu öffnen." : "Erst Aufgabe „Deutung“ bearbeiten!"}</p>
        <button type="button" class="env ${g.opened ? "open" : ""}" id="env" aria-label="Umschlag ${st.label} öffnen"><div class="body"><div class="flap"></div><div class="seal">${st.label}</div><div class="tag">Umschlag ${st.label} · vertraulich</div></div></button>
        <div id="envContent" class="${g.opened ? "" : "hidden"}">${st.html()}</div>`; break;
    case "mark": {
      const molKey = st.mol === "@choice" ? (g.choice || "1s-lsd") : st.mol;
      const cap = st.molCap === "@choice" ? choiceName(molKey) : st.molCap;
      const solved = g.done[st.id];
      h += `<div class="card wide"><span class="kicker">Strukturvergleich</span><p>${st.task}</p>
        <div class="legend"><span><i style="background:rgba(255,196,0,.7)"></i>von euch markiert</span><span>Gestrichelter Rahmen = hier antippen</span></div>
        <div class="mols">${molBox(st.ref, st.refCap, false, solved, k)}${molBox(molKey, cap, !solved, solved, k)}</div></div>`;
      break; }
  }
  return h;
}

function wireStep(k, st, g) {
  const A = g.ans, v = $("stepView");
  v.querySelectorAll("textarea[data-t],input.free[data-t]").forEach(t => t.oninput = () => { A[t.dataset.t] = t.value; t.classList.remove("ok", "bad"); save(); });
  v.querySelectorAll("input[type=checkbox][data-c]").forEach(c => c.onchange = () => { A[st.id + "_c" + c.dataset.c] = c.checked; save(); });
  v.querySelectorAll(".opts input[type=radio]").forEach(r => r.onchange = () => {
    if (r.name === "choose") { g.choice = r.value; g.marks = {}; } else A[r.name] = +r.value;
    r.closest(".opts").querySelectorAll("label").forEach(l => l.classList.remove("ok", "bad")); save();
  });
  if (st.choose && g.choice) { const r = v.querySelector(`input[name=choose][value="${g.choice}"]`); if (r) r.checked = true; }
  v.querySelectorAll("input[name=col]").forEach(r => r.onchange = () => { A.col = r.value; save(); });
  const env = $("env");
  if (env) {
    env.disabled = !g.done.deutung;
    env.onclick = () => { if (!g.done.deutung) return; g.opened = true; env.classList.add("open"); save();
      setTimeout(() => { $("envContent").classList.remove("hidden"); $("checkBtn").classList.remove("hidden"); $("envContent").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" }); }, 450); };
  }
  if (st.type === "mark" && !g.done[st.id]) {
    const box = v.querySelector(".mol.inter"); const key = box.dataset.key;
    const sel = new Set(g.marks[key] || []);
    box.querySelectorAll("circle.hit").forEach(c => {
      if (sel.has(+c.dataset.i)) c.classList.add("on");
      c.onclick = () => { const i = +c.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); c.classList.toggle("on"); box.querySelectorAll("circle.hit").forEach(x => x.classList.remove("ok", "bad", "miss")); g.marks[key] = [...sel]; save(); };
    });
  }
}

function stampIt() { const s = $("stamp"); s.textContent = STAMPS[Math.floor(Math.random() * STAMPS.length)]; s.classList.remove("hidden"); s.style.animation = "none"; void s.offsetWidth; s.style.animation = ""; }

function kwMissing(t) { const n = norm(t.value || ""); return (t.kw || []).filter(group => !group.some(w => n.includes(norm(w)))).length; }

function check() {
  if (S.cur === "R") return checkReview();
  const k = S.cur, grp = G[k], g = S.g[k], st = grp.steps[g.step], A = g.ans, v = $("stepView");
  const errs = []; const tips = [];
  g.tried[st.id] = (g.tried[st.id] || 0) + 1;
  switch (st.type) {
    case "info": case "read":
      if (st.checks) { const n = st.checks.filter((_, i) => A[st.id + "_c" + i]).length; if (n < st.checks.length) errs.push("Hakt alle Punkte der Selbstkontrolle ab – ergänzt vorher, was euch gefehlt hat."); }
      break;
    case "envelope": if (!g.opened) errs.push("Öffnet zuerst den Umschlag."); break;
    case "checklist":
      if (st.choose && !g.choice) errs.push("Entscheidet euch für eine Tablette: 1S-LSD oder 1Fe-LSD.");
      st.items.forEach((it, i) => { if (!A[st.id + "_c" + i]) errs.push(`Noch nicht abgehakt: „${it}“`); });
      break;
    case "observe":
      if (!A.col) errs.push("Wählt die Farbe aus, die ihr beobachtet habt.");
      if ((A.obs || "").trim().length < 15) { errs.push("Beschreibt eure Beobachtung in einem ganzen Satz (vorher → nachher)."); v.querySelector("#t_obs").classList.add("bad"); }
      if (A.col && A.col !== st.expect && !(st.alt || []).includes(A.col)) tips.push(st.expect === "keine" ? "Ihr habt eine Färbung beobachtet? Prüft, ob es nur die Eigenfarbe der Tablette ist, und fragt sonst Frau Huber." : "Ihr habt eine andere Farbe als erwartet? Wiederholt den Test genau nach Anleitung oder fragt Frau Huber.");
      break;
    case "mc": case "texts":
      for (const q of (st.qs || [])) {
        const labels = v.querySelectorAll(`label[data-q="${q.id}"]`);
        labels.forEach(l => l.classList.remove("ok", "bad"));
        if (A[q.id] === undefined) { errs.push(`Noch keine Antwort: „${q.q}“`); continue; }
        if (A[q.id] === q.c) labels[q.c].classList.add("ok");
        else { labels[A[q.id]].classList.add("bad"); errs.push(`„${q.q}“ – das stimmt noch nicht. Lest die Infobox bzw. den Text noch einmal.`); addRev(q.id); }
      }
      for (const t of (st.texts || [])) {
        const el = v.querySelector(`#t_${t.id}`); const val = (A[t.id] || "").trim();
        el.classList.remove("ok", "bad");
        if (val.length < t.min) { el.classList.add("bad"); errs.push(`„${t.label}“ – schreibt etwas ausführlicher (ganze Sätze).`); }
        else { el.classList.add("ok"); if (kwMissing({ value: val, kw: t.kw }) > 1 && t.hint) tips.push(t.hint); }
      }
      break;
    case "mark": {
      const key = st.mol === "@choice" ? (g.choice || "1s-lsd") : st.mol; const m = MOL[key];
      const sel = new Set(g.marks[key] || []); const tgt = new Set(m.target); const opt = new Set(m.optional || []);
      const miss = [...tgt].filter(i => !sel.has(i)); const extra = [...sel].filter(i => !tgt.has(i) && !opt.has(i));
      const box = v.querySelector(".mol.inter");
      box.querySelectorAll("circle.hit").forEach(c => { const i = +c.dataset.i; c.classList.remove("ok", "bad", "miss");
        if (sel.has(i)) c.classList.add(tgt.has(i) || opt.has(i) ? "ok" : "bad"); });
      const r = st.rule; const maxMiss = r.fe0 && key.startsWith("1fe") ? 0 : r.maxMiss;
      if (!sel.size) { errs.push("Tippt die Atome im gestrichelt umrandeten Molekül an."); break; }
      if (r.must && !(m[r.must] || []).every(i => sel.has(i))) errs.push(r.mustMsg);
      if (r.mustIndolN) { const ns = [...tgt].filter(i => m.atoms[i][2] === "N"); const indolN = ns[ns.length - 1]; if (!sel.has(indolN)) errs.push(r.mustMsg); }
      if (miss.length > maxMiss) errs.push(`Es fehlen noch ${miss.length} Atome.`);
      if (extra.length > r.maxExtra) errs.push(`${extra.length} markierte Atome gehören nicht dazu (rot umrandet).`);
      else if (extra.length) tips.push("Fast perfekt – rot markierte Atome gehören nicht dazu.");
      break; }
  }
  if (errs.length) {
    g.first[st.id] = g.first[st.id] ?? false; save(); renderStats();
    setNote(`<p><strong>Noch nicht ganz.</strong></p><ul>${errs.map(e => `<li>${e}</li>`).join("")}</ul>${tips.length ? `<p style="margin-top:6px">💡 ${tips.join(" ")}</p>` : ""}`, "bad");
    return;
  }
  if (g.first[st.id] === undefined) g.first[st.id] = true;
  g.done[st.id] = true; save();
  const silent = ["info", "read", "envelope", "checklist"].includes(st.type);
  if (!silent) stampIt();
  renderStats();
  if (st.type === "mark") { const view = $("stepView"); view.innerHTML = buildStep(k, st, g); wireStep(k, st, g); stampIt(); }
  setNote(`<p><strong>${silent ? "Erledigt." : "Richtig!"}</strong> ${st.type === "mark" ? st.done : (tips.length ? "💡 " + tips.join(" ") : (st.sol ? "Vergleicht eure Antworten jetzt mit der Musterlösung." : "Weiter geht's."))}</p>`, tips.length && !silent ? "info" : "good");
  $("checkBtn").classList.add("hidden");
  const last = g.step === grp.steps.length - 1;
  $("nextBtn").classList.toggle("hidden", last);
  if (last) setNote(`<p><strong>Geschafft!</strong> Ihr habt alle Schritte bearbeitet. Kopiert eure Antworten mit „📋 Antworten kopieren“ und bereitet eure Präsentation vor.</p>`, "good");
  // Phasen auffrischen
  const ph = $("phases").children; if (ph[g.step]) { ph[g.step].classList.add("done"); }
  if (ph[g.step + 1]) { ph[g.step + 1].classList.remove("locked"); const b = ph[g.step + 1].querySelector("button"); b.disabled = false; b.removeAttribute("aria-disabled"); b.onclick = () => { g.step = g.step + 1; save(); render(); }; }
}

function addRev(id) { if (!S.rev.includes(id)) S.rev.push(id); save(); renderStats(); }

function showSol() {
  if (S.cur === "R") return;
  const k = S.cur, g = S.g[k], st = G[k].steps[g.step];
  if (!g.tried[st.id] && !g.done[st.id]) { setNote("<p><strong>Erst selbst probieren!</strong> Die Musterlösung gibt es, nachdem ihr einmal geprüft habt.</p>", "info"); return; }
  let h = st.sol || "";
  if (st.type === "mark") {
    const key = st.mol === "@choice" ? (g.choice || "1s-lsd") : st.mol;
    h = `<p>${st.done}</p><div class="mols">${molBox(st.ref, st.refCap, false, true)}${molBox(key, st.molCap === "@choice" ? choiceName(key) : st.molCap, false, true)}</div>`;
  }
  $("solText").innerHTML = h; $("solution").classList.remove("hidden"); solOpen = true;
  $("solution").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}
function hideSol() { $("solution").classList.add("hidden"); solOpen = false; }

/* ---------- Fehler-Training ---------- */
function renderReview() {
  $("gTitle").textContent = "Fehler-Training"; $("phases").innerHTML = "";
  $("moreActions").classList.add("hidden"); $("backBtn").classList.add("hidden"); $("nextBtn").classList.add("hidden");
  if (!S.rev.length) { $("gStep").textContent = "leer"; $("stepView").innerHTML = `<div class="card"><h3>Alles sauber! 🎉</h3><p>Hier landen Fragen, die ihr beim Prüfen falsch beantwortet habt. Gerade ist nichts zu wiederholen.</p></div>`; setNote("", ""); $("checkBtn").classList.add("hidden"); return; }
  if (revIdx >= S.rev.length) revIdx = 0;
  const q = QS[S.rev[revIdx]];
  $("gStep").textContent = `Fehler-Aufgabe ${revIdx + 1} von ${S.rev.length}`;
  $("stepView").innerHTML = `<div class="card"><span class="kicker">Gruppe ${q.g}</span><p class="q">${q.q}</p><div class="opts">${q.o.map((o, i) => `<label data-i="${i}"><input type="radio" name="rv" value="${i}"> <span>${o}</span></label>`).join("")}</div></div>`;
  setNote("", ""); $("checkBtn").classList.remove("hidden"); $("checkBtn").textContent = "✓ Prüfen";
}
function checkReview() {
  if (!S.rev.length) return;
  const q = QS[S.rev[revIdx]]; const r = document.querySelector("input[name=rv]:checked");
  if (!r) { setNote("<p><strong>Noch keine Antwort.</strong> Wählt eine Antwort aus.</p>", "bad"); return; }
  const labels = document.querySelectorAll("#stepView .opts label"); labels.forEach(l => l.classList.remove("ok", "bad"));
  if (+r.value === q.c) {
    labels[q.c].classList.add("ok"); stampIt();
    S.rev.splice(revIdx, 1); save(); renderStats();
    setNote(`<p><strong>Richtig!</strong> ${q.why} Die Frage ist aus dem Fehler-Training entfernt.</p>`, "good");
    $("checkBtn").classList.add("hidden"); $("nextBtn").classList.remove("hidden");
  } else { labels[+r.value].classList.add("bad"); setNote(`<p><strong>Noch nicht.</strong> Lest die Frage genau und probiert es noch einmal.</p>`, "bad"); revIdx = (revIdx + 0) % S.rev.length; }
}

/* ---------- Export ---------- */
function exportText() {
  const lines = ["Laborheft – Kreuzreaktionen bei Substanztests", ""];
  for (const k of "ABC") {
    const g = S.g[k]; if (!Object.keys(g.ans).length && !g.choice) continue;
    lines.push(`=== Gruppe ${k}: ${G[k].name} ===`);
    if (g.choice) lines.push(`Untersucht: ${g.choice === "1fe-lsd" ? "1Fe-LSD" : "1S-LSD"}`);
    if (g.ans.col) lines.push(`Beobachtete Farbe: ${COLORS.find(c => c.v === g.ans.col).t}${g.ans.time ? " (" + g.ans.time + ")" : ""}`);
    if (g.ans.obs) lines.push(`Beobachtung: ${g.ans.obs}`);
    for (const st of G[k].steps) for (const t of (st.texts || [])) if (g.ans[t.id]) lines.push(`${t.label}\n→ ${g.ans[t.id]}`);
    lines.push("");
  }
  const txt = lines.join("\n");
  $("expText").value = txt; $("expOverlay").classList.remove("hidden");
  try { navigator.clipboard.writeText(txt).catch(() => { }); } catch (e) { }
}

/* ---------- Navigation ---------- */
function next() { if (S.cur === "R") { render(); return; } const g = S.g[S.cur]; if (g.step < G[S.cur].steps.length - 1) { g.step++; save(); render(); window.scrollTo({ top: 0 }); } }
function back() { const g = S.g[S.cur]; if (g.step > 0) { g.step--; save(); render(); } }
let resetArmed = false;
function reset() {
  if (!resetArmed) { resetArmed = true; $("resetBtn").textContent = "Wirklich alles löschen? Nochmal tippen"; setTimeout(() => { resetArmed = false; $("resetBtn").textContent = "↺ Nochmal von vorn"; }, 4000); return; }
  resetArmed = false; $("resetBtn").textContent = "↺ Nochmal von vorn";
  S.g[S.cur] = freshGroup(); S.rev = S.rev.filter(id => QS[id].g !== S.cur); save(); render();
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => { S.cur = t.dataset.g; revIdx = 0; save(); render(); });
$("checkBtn").onclick = check; $("nextBtn").onclick = next; $("backBtn").onclick = back;
$("solBtn").onclick = showSol; $("solClose").onclick = hideSol; $("resetBtn").onclick = reset; $("exportBtn").onclick = exportText;
$("expClose").onclick = () => $("expOverlay").classList.add("hidden");
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("qrOverlay").classList.add("hidden"); $("expOverlay").classList.add("hidden"); }
  if (e.key === "Enter" && !e.shiftKey && e.target.tagName !== "TEXTAREA" && e.target.tagName !== "BUTTON" && !$("checkBtn").classList.contains("hidden")) { e.preventDefault(); check(); }
});
$("qrBtn").onclick = () => {
  $("qrUrl").textContent = PAGE_URL;
  try { const q = qrcode(0, "M"); q.addData(PAGE_URL); q.make(); $("qrBox").innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
  catch (e) { $("qrBox").innerHTML = "<p style='line-height:1.4'>QR-Code konnte nicht geladen werden.</p>"; }
  $("qrOverlay").classList.remove("hidden");
};
$("qrClose").onclick = () => $("qrOverlay").classList.add("hidden");

load(); render();
</script>
</body>
