<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flächenheft 2 – Zerlegen (geführt)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>

:root{--paper:#fdfcf7;--desk:#e9eef3;--karo:#cfdcec;--text:#25303f;--muted:#5b6677;--ink:#1c3fa0;--red:#cf2f2a;--acc:#2f7fc4;
  --hand:"Patrick Hand","Comic Sans MS",cursive;--ui:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#1c2232;--desk:#121620;--karo:#2e3a55;--text:#e7ebf3;--muted:#a4aec3;--ink:#93b6ff;--red:#ff6b64;--acc:#5aa9ec}}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--text);font-family:var(--ui);line-height:1.5;overflow-x:hidden}
main{max-width:720px;margin:0 auto;padding:18px 12px 40px}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.qrbtn{flex:none;width:32px;height:32px;display:grid;place-items:center;border:2px solid var(--text);border-radius:8px;background:var(--paper);color:var(--text);box-shadow:2px 2px 0 var(--text);cursor:pointer;padding:0}
.label{background:var(--paper);border:2px solid var(--text);border-radius:6px;padding:8px 18px 6px;transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--text)}
.label h1{font-family:var(--hand);font-weight:400;font-size:38px;line-height:1;margin:0;color:var(--ink)}
.label p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sheet{position:relative;background:var(--paper);border-radius:14px;border-top:6px solid var(--acc);padding:18px 16px 20px 56px;
  background-image:linear-gradient(var(--karo) 1px,transparent 1px),linear-gradient(90deg,var(--karo) 1px,transparent 1px);background-size:22px 22px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:2px;background:color-mix(in srgb,var(--red) 45%,transparent)}
.card{background:var(--paper);border:2px solid var(--karo);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card h2{font-family:var(--hand);font-weight:400;font-size:26px;margin:0 0 8px;color:var(--ink)}
.btn{display:inline-block;text-decoration:none;color:#fff;background:var(--acc);border:2px solid var(--text);border-radius:10px;padding:9px 14px;font-weight:700;box-shadow:2px 2px 0 var(--text)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
@media (prefers-color-scheme:dark){.btn{color:#141824}}
ol{margin:0;padding-left:22px}li{margin:4px 0}
.hint{background:#fff09a;color:#25303f;border-radius:10px;padding:9px 12px;margin:0 0 12px}
.ov{position:fixed;inset:0;background:rgba(15,20,35,.55);display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.mod{background:var(--paper);border:2px solid var(--text);border-radius:14px;box-shadow:5px 5px 0 var(--text);padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.qrbox{background:#fff;padding:10px;border-radius:10px;line-height:0}
.qrbox svg{width:min(calc(100vw - 90px),calc(100vh - 220px),420px);height:auto}
.url{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere;max-width:420px}
@media (max-width:520px){.sheet{padding-left:34px}.sheet::before{left:22px}}

:root{--green:#1d8248;--yellow:#fff09a;--acc:#e0592a}
@media (prefers-color-scheme:dark){:root{--green:#55d492}}
.q{font-weight:600;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.fin{font-family:var(--hand);font-size:22px;color:var(--ink);background:var(--paper);border:2px solid var(--karo);border-radius:8px;padding:2px 8px;width:7em}
.fin.ok{border-color:var(--green)}.fin.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--paper))}
.fin.s{width:4em}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button.btn{cursor:pointer;font:inherit;font-weight:700}
.btn.sec{background:var(--paper);color:var(--text)}
.btn.help{background:#fff4c8;color:#25303f}
.fb{margin-top:10px;border-radius:10px;padding:8px 12px;display:none}
.fb.ok{display:block;border:2px solid var(--green);color:var(--text)}.fb.bad{display:block;border:2px solid var(--red)}
.fb ul,.hl ul,.why ul{margin:4px 0 0;padding-left:20px}
.hints{margin-top:10px;background:#fff4c8;color:#25303f;border:2px dashed #a8791a;border-radius:10px;padding:8px 12px;display:none}
.hints .hl{padding:4px 0;border-bottom:1px dashed #c9a94a}.hints .hl:last-child{border-bottom:none}.hn{font-weight:700;color:#a8791a}
.why{background:color-mix(in srgb,var(--acc) 10%,var(--paper));border-left:4px solid var(--acc);border-radius:8px;padding:8px 12px;margin:10px 0}
.subs{display:flex;gap:8px;margin:8px 0}.subs div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.choice{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);color:var(--text);border:2px solid var(--karo);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.choice[aria-pressed=true]{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,var(--paper))}
.choice.ok{border-color:var(--green)}.choice.bad{border-color:var(--red)}
.proof{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--text);border:2px solid var(--karo);border-radius:10px;padding:6px 10px;font:inherit;text-align:left;width:100%;overflow-x:auto}
.pl .nr{font-family:var(--hand);font-size:20px;color:var(--muted);min-width:1.2em}
.pl.next{border-style:dashed;opacity:.75}.pl.ok{border-color:var(--green)}.pl.bad{border-color:var(--red)}
button.pl{cursor:pointer}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{background:var(--paper);color:var(--text);border:2px solid var(--text);border-radius:10px;padding:6px 10px;box-shadow:2px 2px 0 var(--text);cursor:pointer;font:inherit;max-width:100%;overflow-x:auto}
.pmini{font-size:13px;color:var(--muted)}
.claim{background:var(--paper);border:2px solid var(--text);border-radius:10px;padding:8px 12px;margin:8px 0;overflow-x:auto}
.rules{margin:8px 0}.rules summary{cursor:pointer;font-weight:700}
.done{color:var(--green);font-weight:700}
.stamp{display:inline-block;transform:rotate(-8deg);border:3px double var(--red);color:var(--red);font-family:var(--hand);font-size:26px;padding:0 10px;border-radius:8px;margin-left:8px}
.sol .sl{background:var(--paper);border-radius:8px;padding:4px 10px;margin:6px 0;overflow-x:auto}.sol .st{color:var(--muted);font-size:14px;margin:0 0 8px 10px}
.lock{display:none}
@media (max-width:520px){.subs{flex-direction:column}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
