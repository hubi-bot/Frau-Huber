<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Codes der Materialien</title>
<style>
:root{--grund:#121620;--papier:#1c2232;--linie:#2e3a55;--schrift:#e7ebf3;--leise:#a4aec3;--pink:#ff6fb5;--pinkk:#d6267f}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--grund);color:var(--schrift);background-image:linear-gradient(rgba(46,58,85,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(46,58,85,.35) 1px,transparent 1px);background-size:22px 22px;padding:24px 12px}
.wrap{max-width:1000px;margin:0 auto}h1{margin:0 0 4px;font-size:1.7rem}p.sub{color:var(--leise);margin:0 0 18px}
.card{background:var(--papier);border-top:4px solid var(--pinkk);border-radius:10px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.35);margin-bottom:16px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--linie);background:#161b29;color:var(--schrift)}
button{background:var(--pinkk);border-color:var(--pinkk);color:#fff;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--linie);vertical-align:top}
th{color:var(--pink);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
td.code{font-family:ui-monospace,Menlo,monospace;font-size:1.15rem;font-weight:700;color:#fff;white-space:nowrap}
a{color:var(--pink)}.grp td{background:#252d44;font-weight:700;color:var(--pink)}
.err{color:#ff8a84;min-height:1.2em}.hint{color:var(--leise);font-size:.85rem}
@media(max-width:640px){th.k,td.k{display:none}}
@media print{body{background:#fff;color:#000}.card{box-shadow:none;background:#fff;border:1px solid #999}td.code{color:#000}.noprint{display:none}a{color:#000}}
</style></head><body><div class="wrap">
<h1>🔑 Codes der Materialien</h1><p class="sub">Nur für Lehrkräfte. Nicht an Schülerinnen und Schüler weitergeben.</p>

 <p class="hint">Den gleichen Code darf es in mehreren Materialien geben. Fehlt ein Material, sag Claude Bescheid.</p>
</div></div>

let D=[];
async function open_(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(ENC.s),iterations:250000,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(ENC.i)},k,b(ENC.c))))}
const KL=k=>k==="Oberstufe"?20:+k||99;
function draw(){const s=document.getElementById("sort").value,q=document.getElementById("q").value.trim().toLowerCase();
 const cmp=(x,y)=>s==="kl"?KL(x.kl)-KL(y.kl)||x.fach.localeCompare(y.fach)||x.mat.localeCompare(y.mat):s==="code"?x.code.localeCompare(y.code,"de",{numeric:true}):(x[s].localeCompare(y[s],"de")||(s==="fach"?KL(x.kl)-KL(y.kl):0)||x.mat.localeCompare(y.mat));
 const R=D.filter(r=>!q||Object.values(r).join(" ").toLowerCase().includes(q)).sort(cmp);
 const KN=k=>/^\d+$/.test(k)?"Klasse "+k:k;const gk=r=>s==="fach"?r.fach+" · "+KN(r.kl):s==="kl"?KN(r.kl):null;let last="";
 document.getElementById("tb").innerHTML=R.map(r=>{const g=gk(r);let h="";if(g&&g!==last){h='<tr class="grp"><td colspan="5">'+esc(g)+"</td></tr>";last=g}
  return h+"<tr><td>"+esc(r.fach)+"</td><td>"+esc(r.kl)+'</td><td><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.mat)+'</a></td><td class="k">'+esc(r.wof)+'</td><td class="code">'+esc(r.code)+"</td></tr>"}).join("")||'<tr><td colspan="5">Nichts gefunden.</td></tr>'}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;document.getElementById("err").textContent="";
 try{D=await open_(pw)}catch(x){document.getElementById("err").textContent="Das Passwort stimmt nicht.";return}
 try{sessionStorage.setItem("codes-pw",pw)}catch(x){}
 document.getElementById("login").hidden=true;document.getElementById("out").hidden=false;draw()};
document.getElementById("q").oninput=draw;document.getElementById("sort").onchange=draw;
document.querySelectorAll("th[data-s]").forEach(t=>t.onclick=()=>{document.getElementById("sort").value=t.dataset.s;draw()});
try{let p=sessionStorage.getItem("codes-pw");try{p=p||localStorage.getItem("ue-pw")||sessionStorage.getItem("ue-pw")}catch(x){}if(p){document.getElementById("pw").value=p;document.getElementById("f").requestSubmit()}}catch(x){}
